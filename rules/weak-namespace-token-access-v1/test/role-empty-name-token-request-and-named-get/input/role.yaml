apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: split-token-minter
  namespace: dev
rules:
- apiGroups: [""]
  resources: ["serviceaccounts/token"]
  resourceNames: [""]
  verbs: ["create"]
- apiGroups: [""]
  resources: ["serviceaccounts"]
  resourceNames: ["deployer"]
  verbs: ["get"]
