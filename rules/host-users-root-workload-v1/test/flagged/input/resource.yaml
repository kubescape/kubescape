apiVersion: apps/v1
kind: Deployment
metadata:
  name: payments-api
  namespace: default
  labels:
    app: payments-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: payments-api
  template:
    metadata:
      labels:
        app: payments-api
    spec:
      containers:
      - name: api
        image: registry.example.com/payments-api:1.4.2
        volumeMounts:
        - name: cache
          mountPath: /var/cache
      - name: sidecar
        image: registry.example.com/log-shipper:2.1.0
        securityContext:
          runAsUser: 1000
      volumes:
      - name: cache
        emptyDir: {}
