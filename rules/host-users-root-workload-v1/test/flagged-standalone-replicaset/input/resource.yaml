# A ReplicaSet created directly, with no Deployment owning it.
apiVersion: apps/v1
kind: ReplicaSet
metadata:
  name: cache-warmer
  namespace: edge
spec:
  replicas: 2
  selector:
    matchLabels:
      app: cache-warmer
  template:
    metadata:
      labels:
        app: cache-warmer
    spec:
      containers:
      - name: warmer
        image: registry.example.com/cache-warmer:1.0.3
        securityContext:
          runAsUser: 0
