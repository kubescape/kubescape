apiVersion: v1
kind: Pod
metadata:
  name: debug-target
  namespace: ops
spec:
  initContainers:
  - name: migrate
    image: registry.example.com/migrate:1.2.0
    securityContext: null
  containers:
  - name: app
    image: registry.example.com/app:2.4.0
    securityContext:
      runAsUser: 1000
  ephemeralContainers:
  - name: debugger
    image: registry.example.com/debug-tools:0.9.0
    securityContext: null
