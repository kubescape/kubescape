apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: team-admin-delegator
  namespace: team-a
rules:
- apiGroups: ["rbac.authorization.k8s.io"]
  resources: ["clusterroles"]
  resourceNames: ["admin"]
  verbs: ["bind"]
- apiGroups: ["rbac.authorization.k8s.io"]
  resources: ["rolebindings"]
  verbs: ["create"]
