apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: rolebinding-namespaced-binding
  namespace: webhooks
subjects:
- kind: ServiceAccount
  name: webhook-manager
  namespace: platform
roleRef:
  kind: ClusterRole
  name: rolebinding-namespaced-role
  apiGroup: rbac.authorization.k8s.io
