# a wildcard-verb rule patches x as well. It is already listed for its other
# verbs, once.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: csr-chain
rules:
- apiGroups: ["certificates.k8s.io"]
  resources: ["certificatesigningrequests"]
  resourceNames: ["x"]
  verbs: ["create","get"]
- apiGroups: ["certificates.k8s.io"]
  resources: ["certificatesigningrequests"]
  resourceNames: ["x"]
  verbs: ["*"]
- apiGroups: ["certificates.k8s.io"]
  resources: ["certificatesigningrequests/approval"]
  verbs: ["update"]
- apiGroups: ["certificates.k8s.io"]
  resources: ["signers"]
  verbs: ["approve"]
