# one patch rule enables both creates. Its paths are listed once.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: csr-chain
rules:
- apiGroups: ["certificates.k8s.io"]
  resources: ["certificatesigningrequests"]
  resourceNames: ["x"]
  verbs: ["create"]
- apiGroups: ["certificates.k8s.io"]
  resources: ["certificatesigningrequests"]
  resourceNames: ["x", "y"]
  verbs: ["create","get"]
- apiGroups: ["certificates.k8s.io"]
  resources: ["certificatesigningrequests"]
  resourceNames: ["x", "y"]
  verbs: ["patch"]
- apiGroups: ["certificates.k8s.io"]
  resources: ["certificatesigningrequests/approval"]
  verbs: ["update"]
- apiGroups: ["certificates.k8s.io"]
  resources: ["signers"]
  verbs: ["approve"]
