# create is narrowed to a name and nothing grants patch on CSRs, so neither a
# plain create (authorized with an empty name) nor a server-side apply (which
# needs patch) can create one: the chain is incomplete.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: named-csr-create
rules:
- apiGroups: ["certificates.k8s.io"]
  resources: ["certificatesigningrequests"]
  resourceNames: ["ignored"]
  verbs: ["create", "list"]
- apiGroups: ["certificates.k8s.io"]
  resources: ["certificatesigningrequests/approval"]
  verbs: ["patch"]
- apiGroups: ["certificates.k8s.io"]
  resources: ["signers"]
  verbs: ["approve"]
