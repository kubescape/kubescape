# the name lists share b, so the subject can apply b and create it.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: secret-writer
rules:
- apiGroups: [""]
  resources: ["secrets"]
  resourceNames: ["a", "b"]
  verbs: ["create"]
- apiGroups: [""]
  resources: ["secrets"]
  resourceNames: ["b", "c"]
  verbs: ["patch"]
