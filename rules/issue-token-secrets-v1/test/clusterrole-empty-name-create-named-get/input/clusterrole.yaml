apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: clusterrole-empty-name-create-named-get
rules:
# create carries the empty name, so resourceNames: [""] authorizes it; the
# subject creates the token secret as sa-token and reads it back.
- apiGroups: [""]
  resources: ["secrets"]
  resourceNames: [""]
  verbs: ["create"]
- apiGroups: [""]
  resources: ["secrets"]
  resourceNames: ["sa-token"]
  verbs: ["get"]
