# create on a and patch on b share no secret name: apply cannot create either.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: secret-writer
rules:
- apiGroups: [""]
  resources: ["secrets"]
  resourceNames: ["a"]
  verbs: ["create"]
- apiGroups: [""]
  resources: ["secrets"]
  resourceNames: ["b"]
  verbs: ["patch"]
