# "" admits the create, but a get carries the secret's real, non-empty name,
# so this entry cannot read the token back.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: clusterrole-empty-name-create-get
rules:
- apiGroups: [""]
  resources: ["secrets"]
  resourceNames: [""]
  verbs: ["create", "get"]
