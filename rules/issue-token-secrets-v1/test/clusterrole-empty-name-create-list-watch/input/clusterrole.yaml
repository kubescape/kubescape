# a list or watch without a metadata.name field selector is authorized with
# the empty name and returns every secret, so "" reads the token back.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: clusterrole-empty-name-create-list-watch
rules:
- apiGroups: [""]
  resources: ["secrets"]
  resourceNames: [""]
  verbs: ["create"]
- apiGroups: [""]
  resources: ["secrets"]
  resourceNames: [""]
  verbs: ["list", "watch"]
