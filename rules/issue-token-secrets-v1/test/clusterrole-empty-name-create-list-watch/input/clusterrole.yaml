# an unfiltered list or watch is authorized with the empty name, so "" reads
# every secret, the minted token included.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: clusterrole-empty-name-create-list-watch
rules:
- apiGroups: [""]
  resources: ["secrets"]
  resourceNames: [""]
  verbs: ["create"]
- apiGroups: [""]
  resources: ["secrets"]
  resourceNames: [""]
  verbs: ["list", "watch"]
