# a list or watch narrowed to "" only matches through a metadata.name field
# selector, which no real secret's name satisfies, so it is not a read grant.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: clusterrole-empty-name-create-list-watch
rules:
- apiGroups: [""]
  resources: ["secrets"]
  resourceNames: [""]
  verbs: ["create"]
- apiGroups: [""]
  resources: ["secrets"]
  resourceNames: [""]
  verbs: ["list", "watch"]
