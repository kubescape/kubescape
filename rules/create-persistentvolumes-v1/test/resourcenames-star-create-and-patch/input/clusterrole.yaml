# resourceNames: ["*"] names a PersistentVolume literally called "*", which cannot exist, so apply creates nothing.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: named-pv-applier
rules:
- apiGroups: [""]
  resources: ["persistentvolumes"]
  resourceNames: ["*"]
  verbs: ["create", "patch"]
