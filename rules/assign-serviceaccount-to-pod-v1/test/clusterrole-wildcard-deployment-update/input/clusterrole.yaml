apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: clusterrole-wildcard-deployment-update
rules:
# resourceNames has no wildcard form in RBAC, so this update reaches nothing.
- apiGroups: ["apps"]
  resources: ["deployments"]
  resourceNames: ["*"]
  verbs: ["update", "patch"]

