name: 02-create_release
permissions: read-all
on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
  workflow_dispatch:
    inputs:
      skip_publish:
        description: "Skip publishing artifacts"
        required: false
        default: true
        type: boolean
jobs:
  release:
    permissions:
      actions: read
      checks: read
      contents: write
      deployments: read
      discussions: read
      id-token: write
      issues: read
      models: read
      packages: write
      pages: read
      pull-requests: read
      repository-projects: read
      statuses: read
      security-events: read
      attestations: write
      artifact-metadata: read
    runs-on: ubuntu-large
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # Go resolves a module by the major version written into its path, so a
      # vN tag on a module declaring /v(N-1) publishes a release that nobody
      # can `go get`. That is not hypothetical: v4.0.0 through v4.0.12 shipped
      # against a `/v3` module path and were all uninstallable as Go modules.
      #
      # Tagging touches no file, so no pull-request check can catch this; it
      # has to be asserted against the tag itself. Kept first in the job so a
      # mistagged release fails in seconds, before any artifact is built,
      # signed or pushed. internal/ghworkflows asserts this step still exists.
      - name: Verify module path matches release tag
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          tag_major="$(printf '%s' "$TAG" | sed -n 's|^v\([0-9][0-9]*\)\..*|\1|p')"
          if [ -z "$tag_major" ]; then
            echo "::error::cannot read a major version from tag '$TAG'"
            exit 1
          fi

          # Module paths carry the major version as a /vN suffix from v2 on;
          # v0 and v1 carry none.
          if [ "$tag_major" -le 1 ]; then
            want=""
          else
            want="/v$tag_major"
          fi

          rc=0
          path="$(sed -n 's|^module[[:space:]][[:space:]]*||p' go.mod | head -n1)"
          got="$(printf '%s' "$path" | sed -n 's|.*\(/v[0-9][0-9]*\)$|\1|p')"

          if [ "$got" != "$want" ]; then
            echo "::error file=go.mod::module path '$path' does not match release tag $TAG (expected it to end in '${want:-no /vN suffix}'). Releasing this tag would produce a version that cannot be resolved with 'go get' or 'go install'."
            rc=1
          fi
          exit $rc

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26"

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.9"

      - name: Install system dependencies for system-tests
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libpq5 \
            libpq-dev \
            gcc \
            python3-dev
          sudo rm -rf /var/lib/apt/lists/*

      - name: Install Cosign
        uses: sigstore/cosign-installer@59acb6260d9c0ba8f4a2f9d9b48431a222b68e20 # v3.5.0

      - name: Create Cosign Key
        run: echo "${{ secrets.COSIGN_PRIVATE_KEY_V1 }}" > cosign.key

      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Login to Quay.io
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: quay.io
          username: ${{ secrets.QUAYIO_REGISTRY_USERNAME }}
          password: ${{ secrets.QUAYIO_REGISTRY_PASSWORD }}

      - uses: anchore/sbom-action/download-syft@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        name: Setup Syft

      - name: Create k8s Kind Cluster
        uses: helm/kind-action@ef37e7f390d99f746eb8b610417061a60e82a6cc # v1.14.0
        with:
          cluster_name: kubescape-e2e

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          distribution: goreleaser
          version: latest
          args: release --clean ${{ inputs.skip_publish == true && '--skip=publish' || '' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GH_PERSONAL_ACCESS_TOKEN || secrets.GITHUB_TOKEN }}
          COSIGN_PWD: ${{ secrets.COSIGN_PRIVATE_KEY_V1_PASSWORD }}
          RELEASE: ${{ github.ref_name }}
          CLIENT: release
          RUN_E2E: "true"
          KUBESCAPE_SKIP_UPDATE_CHECK: "true"
          CUSTOMER: ${{ secrets.CUSTOMER }}
          USERNAME: ${{ secrets.USERNAME }}
          PASSWORD: ${{ secrets.PASSWORD }}
          CLIENT_ID: ${{ secrets.CLIENT_ID_PROD }}
          SECRET_KEY: ${{ secrets.SECRET_KEY_PROD }}
          REGISTRY_USERNAME: ${{ secrets.REGISTRY_USERNAME }}
          REGISTRY_PASSWORD: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Attest build provenance
        if: (github.event_name != 'workflow_dispatch' || inputs.skip_publish != true) && hashFiles('dist/**/*.tar.gz') != ''
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/**/*.tar.gz
            dist/**/kubescape
            dist/**/kubescape.exe
            dist/**/ksserver
            dist/**/downloader

      - name: Update new version in krew-index
        if: github.event_name != 'workflow_dispatch' || inputs.skip_publish != true
        uses: rajatjindal/krew-release-bot@c970b8a8f6dbc2f2285a26e3ae160903b87002c3 # v0.0.51
        with:
          krew_template_file: dist/krew/kubescape.yaml

      - name: List collected system-test results (debug)
        if: always()
        run: |
          echo "Listing test-results/system-tests (if any):"
          ls -laR test-results/system-tests || true

      - name: System Tests Report
        uses: mikepenz/action-junit-report@a9170d5795813c01ab4901ffb045b52bab4ab09d # v6.5.0
        if: always()
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          report_paths: "test-results/system-tests/**/results_xml_format/**.xml"
          annotate_only: true
          job_summary: true
