# Runs the OSPS Baseline scanner against this repository on every push to the
# default branch and weekly. Results are in the run summary and the
# osps-baseline-results artifact; nothing is published outside the repository.
name: OSPS Baseline scan

on:
  push:
    branches: [master]
  schedule:
    - cron: "0 3 * * 1"
  workflow_dispatch: {}

permissions: {}

jobs:
  scan:
    name: OSPS Baseline scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Run the OSPS Baseline scanner
        uses: revanite-io/osps-baseline-action@d0d850b592f1788b2631f1dfdf84d80ea8c720f5 # v1.5.3
        with:
          owner: ${{ github.repository_owner }}
          repo: ${{ github.event.repository.name }}
          token: ${{ github.token }}
          catalog: osps-baseline-2026-08
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: osps-baseline-results
          path: evaluation_results/
          retention-days: 30
