# Make sure to check the documentation at https://goreleaser.com

# The lines below are called `modelines`. See `:help modeline`
# Feel free to remove those if you don't want/need to use them.
# yaml-language-server: $schema=https://goreleaser.com/static/schema.json
# vim: set ts=2 sw=2 tw=0 fo=cnqoj

version: 2

before:
  hooks:
    - go test -v ./...

archives:
  - id: cli
    ids:
      - cli

    formats:
      - binary
      - tar.gz

builds:
  - id: cli
    binary: kubescape
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -X main.version={{.Tag}}
      - -X main.commit={{.Commit}}
      - -X main.date={{.Date}}
      - -X github.com/kubescape/backend/pkg/versioncheck.Client={{.Env.CLIENT}}
    hooks:
      post:
        - cmd: sh .github/scripts/goreleaser-post-e2e.sh
          env:
            - GOOS={{ .Os }}
            - GOARCH={{ .Arch }}
  - id: downloader
    dir: downloader
    binary: downloader
    env:
      - CGO_ENABLED=0
    goos:
      - linux
    goarch:
      - amd64
      - arm64
  - id: http
    dir: httphandler
    binary: ksserver
    env:
      - CGO_ENABLED=0
    goos:
      - linux
    goarch:
      - amd64
      - arm64
nfpms:
  - id: cli
    package_name: kubescape
    ids:
      - cli
    vendor: Kubescape
    homepage: https://kubescape.io/
    maintainer: matthiasb@kubescape.io
    formats:
      - apk
      - deb
      - rpm
    bindir: /usr/bin

# Cosign signature over the checksum manifest. checksums.sha256 already covers
# every published asset, so signing that one file transitively binds all of
# them to this repository's release workflow, at the cost of two extra assets
# rather than one pair per artifact.
#
# Keyless on purpose, unlike docker_signs below. That block signs container
# images with the COSIGN_PRIVATE_KEY_V1 pair, but the matching public key is
# published nowhere a user running install.sh can reach it, so a keyed blob
# signature would be unverifiable by the very people it exists to protect.
# Keyless binds the signature to the release workflow's OIDC identity and needs
# no key distribution: 02-release.yaml already grants `id-token: write`, and the
# certificate is uploaded next to the signature so the signing identity can be
# checked rather than merely assumed.
#
# Verify a downloaded release with:
#   cosign verify-blob checksums.sha256 \
#     --signature checksums.sha256.sig \
#     --certificate checksums.sha256.pem \
#     --certificate-oidc-issuer https://token.actions.githubusercontent.com \
#     --certificate-identity-regexp '^https://github\.com/kubescape/kubescape/\.github/workflows/02-release\.yaml@refs/tags/'
signs:
  - id: checksum
    cmd: cosign
    signature: "${artifact}.sig"
    certificate: "${artifact}.pem"
    args:
      - sign-blob
      - "--output-signature=${signature}"
      - "--output-certificate=${certificate}"
      - "${artifact}"
      - "--yes"
    artifacts: checksum
    output: true

docker_signs:
  - stdin: "{{ .Env.COSIGN_PWD }}"

dockers_v2:
  - id: cli
    images:
      - "quay.io/kubescape/kubescape-cli"
    tags:
      - "{{ .Tag }}"
    labels:
      "org.opencontainers.image.description": "Kubescape CLI"
      "org.opencontainers.image.created": "{{.Date}}"
      "org.opencontainers.image.name": "{{.ProjectName}}"
      "org.opencontainers.image.revision": "{{.FullCommit}}"
      "org.opencontainers.image.version": "{{.Version}}"
      "org.opencontainers.image.source": "{{.GitURL}}"
    ids:
      - cli
    dockerfile: build/kubescape-cli.Dockerfile
  - id: http
    images:
      - "quay.io/kubescape/kubescape"
    tags:
      - "{{ .Tag }}"
    labels:
      "org.opencontainers.image.description": "Kubescape microservice"
      "org.opencontainers.image.created": "{{.Date}}"
      "org.opencontainers.image.name": "{{.ProjectName}}"
      "org.opencontainers.image.revision": "{{.FullCommit}}"
      "org.opencontainers.image.version": "{{.Version}}"
      "org.opencontainers.image.source": "{{.GitURL}}"
    ids:
      - downloader
      - http
    dockerfile: build/Dockerfile

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"

checksum:
  name_template: "checksums.sha256"

sboms:
  - artifacts: binary

krews:
  - name: kubescape
    ids:
      - cli
    skip_upload: true
    homepage: https://kubescape.io/
    description: It includes risk analysis, security compliance, and misconfiguration scanning with an easy-to-use CLI interface, flexible output formats, and automated scanning capabilities.
    short_description: Scan resources and cluster configs against security frameworks.
    caveats: |
      Requires kubectl and basic knowledge of Kubernetes.
      Run 'kubescape scan' to scan your Kubernetes cluster or manifests.

release:
  draft: false
  footer: >-

    ---

    Released by [GoReleaser](https://github.com/goreleaser/goreleaser).
