name: user-subject-serviceaccount-username
description: |
  A ServiceAccount authenticates as the user
  system:serviceaccount:<namespace>:<name>, and Kubernetes matches a User
  subject against the authenticated username. A binding that names that
  username as a User therefore applies to the ServiceAccount.
objects:
  - {apiVersion: v1, kind: Namespace, metadata: {name: lab}}
  - {apiVersion: v1, kind: ServiceAccount, metadata: {name: target, namespace: lab}}
  - {apiVersion: v1, kind: ServiceAccount, metadata: {name: named-as-user, namespace: lab}}
  - {apiVersion: v1, kind: ServiceAccount, metadata: {name: unbound, namespace: lab}}
  - {apiVersion: v1, kind: ServiceAccount, metadata: {name: other-namespace, namespace: lab}}
  - apiVersion: rbac.authorization.k8s.io/v1
    kind: Role
    metadata: {name: token-minter, namespace: lab}
    rules:
      - {apiGroups: [""], resources: ["serviceaccounts/token"], verbs: [create]}
  - apiVersion: rbac.authorization.k8s.io/v1
    kind: RoleBinding
    metadata: {name: by-username, namespace: lab}
    roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: token-minter}
    subjects:
      - {apiGroup: rbac.authorization.k8s.io, kind: User, name: "system:serviceaccount:lab:named-as-user"}
      # Same ServiceAccount name, different namespace: a different identity.
      - {apiGroup: rbac.authorization.k8s.io, kind: User, name: "system:serviceaccount:elsewhere:other-namespace"}
questions:
  - id: user-subject-with-serviceaccount-username-applies
    serviceAccount: {namespace: lab, name: named-as-user}
    mintToken: {namespace: lab, name: target}
    kubernetes: allowed
  # Control: no binding names this ServiceAccount in any form.
  - id: serviceaccount-without-binding-is-denied
    serviceAccount: {namespace: lab, name: unbound}
    mintToken: {namespace: lab, name: target}
    kubernetes: denied
  # Control: the User subject names a ServiceAccount of the same name in another namespace.
  - id: username-of-another-namespace-does-not-apply
    serviceAccount: {namespace: lab, name: other-namespace}
    mintToken: {namespace: lab, name: target}
    kubernetes: denied
