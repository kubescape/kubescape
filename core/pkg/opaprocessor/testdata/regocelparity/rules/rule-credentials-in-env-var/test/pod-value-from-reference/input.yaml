apiVersion: v1
kind: Pod
metadata:
  name: value-from-reference
spec:
  containers:
    - name: test-container
      env:
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: database-secret
              key: password
        - name: CONFIG_PASSWORD
          valueFrom:
            configMapKeyRef:
              name: database-config
              key: password
