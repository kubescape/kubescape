apiVersion: v1
kind: Pod
metadata:
  name: audit-pod
  labels:
    app: payment-service
spec:
  containers:
    - name: payment-api
      image: nginx:1.29
      securityContext:
        allowPrivilegeEscalation: true
      env:
        - name: LOG_LEVEL
          value: info
        - name: DB_PASSWORD
          value: hunter2
        - name: PORT
          value: "8080"
