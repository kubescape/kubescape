  labels:
    controlId: C-0203
  name: kubescape-c-0203-deny-hostpath-volumes
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
    - apiGroups:
      - ""
      apiVersions:
      - v1
      operations:
      - CREATE
      - UPDATE
