          : (has(variables.podSecurityContext) && has(variables.podSecurityContext.seccompProfile) && has(variables.podSecurityContext.seccompProfile.type)
              ? variables.podSecurityContext.seccompProfile.type
              : 'Unconfined')
        ) != 'Unconfined'
