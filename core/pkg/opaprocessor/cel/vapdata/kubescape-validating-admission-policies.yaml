apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: cluster-policy-deny-host-mount
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
    - apiGroups:
      - ""
      apiVersions:
      - v1
      operations:
      - CREATE
      - UPDATE
      resources:
      - pods
    - apiGroups:
      - apps
      apiVersions:
      - v1
      operations:
      - CREATE
      - UPDATE
      resources:
      - deployments
      - replicasets
      - daemonsets
      - statefulsets
    - apiGroups:
      - batch
      apiVersions:
      - v1
      operations:
      - CREATE
      - UPDATE
      resources:
      - jobs
      - cronjobs
  validations:
  - expression: object.kind != 'Pod' || (!has(object.spec.volumes)) || object.spec.volumes.all(vol,
      !(has(vol.hostPath)))
    message: There are one or more hostPath mounts in the Pod! (see more at https://kubescape.io/docs/controls/c-0048/)
  - expression: '[''Deployment'',''ReplicaSet'',''DaemonSet'',''StatefulSet'',''Job''].all(kind,
      object.kind != kind) || (!has(object.spec.template.spec.volumes)) || object.spec.template.spec.volumes.all(vol,
      !(has(vol.hostPath)))'
    message: There are one or more hostPath mounts in the Workload! (see more at https://kubescape.io/docs/controls/c-0048/)
  - expression: object.kind != 'CronJob' || (!has(object.spec.jobTemplate.spec.template.spec.volumes))
      || object.spec.jobTemplate.spec.template.spec.volumes.all(vol, !(has(vol.hostPath)))
    message: There are one or more hostPath mounts in the CronJob! (see more at https://kubescape.io/docs/controls/c-0048/)
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: cluster-policy-deny-insecure-capabilities
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
    - apiGroups:
      - ""
      apiVersions:
      - v1
      operations:
      - CREATE
      - UPDATE
      resources:
      - pods
    - apiGroups:
      - apps
      apiVersions:
      - v1
      operations:
      - CREATE
      - UPDATE
      resources:
      - deployments
      - replicasets
      - daemonsets
      - statefulsets
    - apiGroups:
      - batch
      apiVersions:
      - v1
      operations:
      - CREATE
      - UPDATE
      resources:
      - jobs
      - cronjobs
  paramKind:
    apiVersion: kubescape.io/v1
    kind: ControlConfiguration
  validations:
  - expression: |
      object.kind != 'Pod' || object.spec.containers.all(container, !has(container.securityContext) || !has(container.securityContext.capabilities) || !has(container.securityContext.capabilities.add) || (container.securityContext.capabilities.add.all(capability, capability.upperAscii() != 'ALL') && params.settings.insecureCapabilities.all(insecureCapability, container.securityContext.capabilities.add.all(capability, capability.upperAscii() != insecureCapability.upperAscii()))) )
    message: Pod has one or more containers with insecure capabilities! (see more
      at https://kubescape.io/docs/controls/c-0046/)
  - expression: |
      ['Deployment','ReplicaSet','DaemonSet','StatefulSet','Job'].all(kind, object.kind != kind) || object.spec.template.spec.containers.all(container, !has(container.securityContext) || !has(container.securityContext.capabilities) || !has(container.securityContext.capabilities.add) || (container.securityContext.capabilities.add.all(capability, capability.upperAscii() != 'ALL') && params.settings.insecureCapabilities.all(insecureCapability, container.securityContext.capabilities.add.all(capability, capability.upperAscii() != insecureCapability.upperAscii()))) )
    message: Workload has one or more containers with insecure capabilities! (see
      more at https://kubescape.io/docs/controls/c-0046/)
  - expression: |
      object.kind != 'CronJob' || object.spec.jobTemplate.spec.template.spec.containers.all(container, !has(container.securityContext) || !has(container.securityContext.capabilities) || !has(container.securityContext.capabilities.add) || (container.securityContext.capabilities.add.all(capability, capability.upperAscii() != 'ALL') && params.settings.insecureCapabilities.all(insecureCapability, container.securityContext.capabilities.add.all(capability, capability.upperAscii() != insecureCapability.upperAscii()))) )
    message: CronJob has one or more containers with insecure capabilities! (see more
      at https://kubescape.io/docs/controls/c-0046/)
---
