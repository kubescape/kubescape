  labels:
    controlId: C-0020
  name: kubescape-c-0020-deny-resources-having-volumes-with-potential-access-to-known-cloud-credentials
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
    - apiGroups:
      - ""
      apiVersions:
      - v1
      operations:
      - CREATE
      - UPDATE
      resources:
