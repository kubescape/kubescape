    messageExpression: |
      object.kind + '/' + object.metadata.name + ' has a hostPath volume, which mounts a path from the node into its pods. (see more at https://kubescape.io/docs/controls/c-0203/)'
  - expression: |
      object.kind != 'CronJob' || !has(object.spec.jobTemplate.spec.template.spec.volumes) || object.spec.jobTemplate.spec.template.spec.volumes.all(volume, !has(volume.hostPath))
    messageExpression: |
