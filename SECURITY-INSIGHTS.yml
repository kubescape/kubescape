header:
  schema-version: 1.0.0
  last-updated: '2026-08-16'
  last-updated-by: 1PoPTRoN
  last-reviewed: '2026-08-16'
  expiration-date: '2027-02-16T00:00:00.000Z'
  project-url: https://github.com/kubescape/kubescape/
  project-release: v4.0.12
project-lifecycle:
  status: active
  bug-fixes-only: false
  core-maintainers:
  - github:amirmalka
  - github:bezbran
  - github:matthyx
  - github:rotemamsa
  - github:slashben
contribution-policy:
  accepts-pull-requests: true
  accepts-automated-pull-requests: true
  code-of-conduct: https://github.com/kubescape/kubescape/blob/master/CODE_OF_CONDUCT.md
dependencies:
  third-party-packages: true
  dependencies-lists:
  - https://github.com/kubescape/kubescape/blob/master/go.mod
  - https://github.com/kubescape/kubescape/blob/master/httphandler/go.mod
  env-dependencies-policy:
    policy-url: https://github.com/kubescape/kubescape/blob/master/docs/environment-dependencies-policy.md
documentation:
- https://github.com/kubescape/kubescape/tree/master/docs
distribution-points:
- https://github.com/kubescape/kubescape/
security-artifacts:
  threat-model:
    threat-model-created: false
security-testing:
- tool-type: sca
  tool-name: Dependabot
  tool-version: latest
  integration:
    ad-hoc: false
    ci: true
    before-release: false
  comment: |
    Dependabot is configured in .github/dependabot.yaml and guarded by the
    tests in internal/ghworkflows. Its pull requests run the full PR suite
    (00-pr-scanner.yaml) and are accepted and merged, hence
    accepts-automated-pull-requests: true and ci: true. before-release stays
    false until a release-time gate requires fresh dependencies or their CI
    results: 02-release.yaml runs none today.
security-contacts:
- type: email
  value: cncf-kubescape-maintainers@lists.cncf.io
vulnerability-reporting:
  accepts-vulnerability-reports: true
  security-policy: https://github.com/kubescape/kubescape/security/policy
  email-contact: cncf-kubescape-maintainers@lists.cncf.io
  comment: |
    The first and best way to report a vulnerability is by using private security issues in GitHub.
